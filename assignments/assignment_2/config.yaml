# SimpleFlatWorld: scaled inputs, rhythm and Xavier uniform initialization.
# Per seed: 128 initial evaluations + 64 offspring x 100 generations = 6,528.
SEEDS: [42]
ROBOT: iguana
WORLD: SimpleFlatWorld
SPAWN_POS: [0.0, 0.0, 0.1]
SIM_DURATION: 120.0
MODE: simple
HIDDEN_SIZE: 20
WEIGHT_INIT: xavier_uniform
RHYTHM_FREQUENCY: 1.0  # Hz: one full sine/cosine cycle per simulated second.

# Fixed input divisors, not clipping or unit-vector normalization.
# Starting values to test; values can exceed [-1, 1].
NORMALIZE_INPUTS: true
TARGET_INPUTS: true  # Append (target XY - robot XY), using POSITION_SCALE.
POSITION_SCALE: 5.0          # metres
JOINT_ANGLE_SCALE: 1.5707963267948966  # radians (pi/2)
LINEAR_VELOCITY_SCALE: 1.0   # metres/second
ANGULAR_VELOCITY_SCALE: 5.0  # radians/second
JOINT_VELOCITY_SCALE: 10.0   # radians/second

TARGET_POPULATION_SIZE: 128
NUM_STEPS: 100
# Separate from the previous run. Change this name for another saved run.
RUN_NAME: iguana_target_inputs_120s_v1

# baseline: remaining XY distance.
# improved: success first, then time inside the target and optional arrival-time cost.
FITNESS_TYPE: baseline
# Alpha in [0, 1]: adds alpha * (first arrival time / duration) after success.
# Never reaching scores 3 + final_distance / initial_distance. Set alpha=0 to omit timing.
SPEED_PENALTY: 1.0

# Available: "none" (copy parents, then mutate), one_point, n_point, uniform.
CROSSOVER_TYPE: one_point
CROSSOVER_N_POINTS: 2      # Used only by n_point.
CROSSOVER_SWAP_PROB: 0.5  # Per-gene swap probability; used only by uniform.

# Available: gaussian, uniform_reset, "none".
MUTATION_TYPE: gaussian
MUTATION_PROB: 0.2       # Probability per weight.
MUTATION_STD: 0.5        # Gaussian noise standard deviation.
MUTATION_LOW: -1.0      # Uniform reset lower bound (inclusive).
MUTATION_HIGH: 1.0      # Uniform reset upper bound (exclusive).

# tournament; uniform.
PARENT_SELECTION_TYPE: tournament
OFFSPRING_SIZE: 64              # lambda children; also the number of mating slots.
TOURNAMENT_SIZE: 2              # k contestants per independent tournament.
TOURNAMENT_WITH_REPLACEMENT: false  # Within a tournament; repeat winners are allowed.

# round_robin_tournament or mu_plus_lambda.
SURVIVOR_SELECTION_TYPE: mu_plus_lambda
ROUND_ROBIN_OPPONENTS: 10        # q distinct others per candidate; only round-robin.
